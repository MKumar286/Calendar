<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 – 2027 Desktop Calendar Planner with Notes</title>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --border-color: #cbd5e1;
      
      --bg-govt: #fee2e2;
      --color-govt: #dc2626;
      --bg-jntuh: #dcfce7;
      --color-jntuh: #16a34a;
      --bg-optional: #ffedd5;
      --color-optional: #ea580c;
      --bg-festival: #dbeafe;
      --color-festival: #2563eb;
      --bg-sunday: #fff1f2;
      --color-sunday: #be123c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 8px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Minimal Filter Control Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #0f172a;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-label { font-size: 0.85rem; font-weight: 700; color: #fbbf24; }
    
    select {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Zero Vertical Scroll Main Layout */
    .calendar-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .month-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 6px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    
    .month-title { font-size: 1.1rem; font-weight: 800; color: #1e3a8a; }
    .samvatsara-info { font-size: 0.72rem; background: #fef3c7; color: #92400e; padding: 2px 8px; border-radius: 4px; font-weight: 700; }

    /* Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: auto repeat(6, 1fr);
      gap: 5px;
      flex-grow: 1;
      height: 100%;
    }

    .grid-header {
      background: #0f172a;
      color: #fff;
      text-align: center;
      padding: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 6px;
    }

    /* Square Boxes with Curved Corners */
    .day-cell {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px; /* Square Curved Corner Styling */
      padding: 4px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .day-cell.empty { background: transparent; border: none; }
    .day-cell.sunday { background: var(--bg-sunday); }

    /* Holiday Highlight Styles */
    .day-cell.is-govt { background-color: var(--bg-govt) !important; border-color: var(--color-govt) !important; }
    .day-cell.is-jntuh { background-color: var(--bg-jntuh) !important; border-color: var(--color-jntuh) !important; }
    .day-cell.is-optional { background-color: var(--bg-optional) !important; border-color: var(--color-optional) !important; }
    .day-cell.is-festival { background-color: var(--bg-festival) !important; border-color: var(--color-festival) !important; }

    .cell-top { display: flex; justify-content: space-between; align-items: flex-start; line-height: 1; }
    .date-num { font-size: 0.85rem; font-weight: 800; color: #0f172a; }
    .day-cell.sunday .date-num { color: var(--color-sunday); }

    .holiday-badge {
      font-size: 0.55rem;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
      color: #fff;
    }
    .badge-govt { background: var(--color-govt); }
    .badge-jntuh { background: var(--color-jntuh); }
    .badge-optional { background: var(--color-optional); }
    .badge-festival { background: var(--color-festival); }

    .key-tithi-tag {
      font-size: 0.55rem;
      padding: 1px 3px;
      border-radius: 3px;
      font-weight: 800;
      margin-top: 1px;
      display: inline-block;
      line-height: 1;
      white-space: nowrap;
    }
    .tag-pournami { background-color: #fef08a; color: #854d0e; border: 1px solid #fde047; }
    .tag-amavasya { background-color: #334155; color: #ffffff; }
    .tag-ashtami  { background-color: #e0e7ff; color: #3730a3; }
    .tag-navami   { background-color: #fce7f3; color: #9d174d; }
    .tag-dashami  { background-color: #ccfbf1; color: #115e59; }

    .event-desc {
      font-size: 0.58rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 1px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Panchang Details Footer */
    .panchang-box {
      margin-top: 2px;
      background: rgba(241, 245, 249, 0.9);
      border-radius: 4px;
      padding: 1px 3px;
      font-size: 0.52rem;
      line-height: 1.1;
      color: #334155;
      border-top: 1px solid #cbd5e1;
    }
    .panchang-masa { font-weight: 700; color: #1e3a8a; }
    .panchang-tithi { font-weight: 600; color: #b45309; }

    /* Daily Input Notes Area */
    .day-note {
      width: 100%;
      flex-grow: 1;
      margin-top: 2px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      resize: none;
      padding: 2px 4px;
      font-size: 0.65rem;
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
      line-height: 1.15;
    }
    .day-note:focus {
      outline: none;
      border-color: #1e3a8a;
      background: #ffffff;
    }

    .college-panel {
      margin-top: 4px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 0.7rem;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Controls: Year & Month Filters -->
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Year:</span>
      <select id="yearFilter" onchange="applyFilters()">
        <option value="2026">2026</option>
        <option value="2027">2027</option>
      </select>
    </div>

    <div class="filter-group">
      <span class="filter-label">Month:</span>
      <select id="monthFilter" onchange="applyFilters()">
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8">September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
      </select>
    </div>
  </div>

  <!-- Main Grid Area -->
  <div class="calendar-container" id="calendar-output"></div>

  <script>
    const lunarMasas = [
      "Chaitra", "Vaishakha", "Jyeshtha", "Ashadha", 
      "Shravana", "Bhadrapada", "Ashvin", "Kartika", 
      "Margashirsha", "Pushya", "Magha", "Phalguna"
    ];

    const tithiNamesShukla = [
      "Padyami", "Vidiya", "Thadiya", "Chavithi", "Panchami", 
      "Shashti", "Saptami", "Ashtami", "Navami", "Dashami", 
      "Ekadashi", "Dwadashi", "Thrayodashi", "Chaturdashi", "Pournami"
    ];

    const tithiNamesKrishna = [
      "Padyami", "Vidiya", "Thadiya", "Chavithi", "Panchami", 
      "Shashti", "Saptami", "Ashtami", "Navami", "Dashami", 
      "Ekadashi", "Dwadashi", "Thrayodashi", "Chaturdashi", "Amavasya"
    ];

    const weekDaysEn = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const monthNamesEn = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    function getTeluguPanchang(year, monthIndex, day) {
      const currentDate = new Date(year, monthIndex, day);
      const refDate = new Date(2026, 0, 19);
      const diffDays = Math.floor((currentDate - refDate) / (1000 * 60 * 60 * 24));
      
      const synodicMonth = 29.530588;
      const totalLunarMonths = Math.floor(diffDays / synodicMonth);
      
      let masaIdx = (10 + totalLunarMonths) % 12;
      if (masaIdx < 0) masaIdx += 12;

      let phase = ((diffDays % synodicMonth) + synodicMonth) % synodicMonth;
      let tithiVal = Math.floor((phase / synodicMonth) * 30);

      let paksham = tithiVal < 15 ? "Shukla" : "Krishna";
      let tithiName = tithiVal < 15 ? tithiNamesShukla[tithiVal] : tithiNamesKrishna[tithiVal - 15];

      return {
        masa: lunarMasas[masaIdx],
        paksham: paksham,
        tithi: tithiName
      };
    }

    const holidaysData2026 = {
      "1-1": { name: "New Year", type: "national", badge: "New Year" },
      "1-13": { name: "Bhogi", type: "festival", badge: "Bhogi" },
      "1-14": { name: "Sankranti / Pongal", type: "govt", badge: "Govt Holiday" },
      "1-15": { name: "Kanuma", type: "optional", badge: "Optional" },
      "1-26": { name: "Republic Day", type: "govt", badge: "Govt Holiday" },
      "2-15": { name: "Maha Shivaratri", type: "govt", badge: "Govt Holiday" },
      "3-3": { name: "Holi", type: "govt", badge: "Govt Holiday" },
      "3-19": { name: "Ugadi", type: "govt", badge: "Govt Holiday" },
      "3-21": { name: "Eid-ul-Fitr (Ramzan)", type: "govt", badge: "Govt Holiday" },
      "3-27": { name: "Sri Rama Navami", type: "govt", badge: "Govt Holiday" },
      "4-3": { name: "Good Friday", type: "govt", badge: "Govt Holiday" },
      "4-14": { name: "Dr. Ambedkar Jayanti", type: "govt", badge: "Govt Holiday" },
      "5-1": { name: "May Day", type: "govt", badge: "Govt Holiday" },
      "5-27": { name: "Bakrid (Eid-ul-Adha)", type: "govt", badge: "Govt Holiday" },
      "6-2": { name: "Telangana Formation Day", type: "govt", badge: "Govt Holiday" },
      "6-25": { name: "Muharram", type: "govt", badge: "Govt Holiday" },
      "7-20": { name: "Bonalu", type: "govt", badge: "Govt Holiday" },
      "8-15": { name: "Independence Day", type: "govt", badge: "Govt Holiday" },
      "8-25": { name: "Milad-un-Nabi", type: "govt", badge: "Govt Holiday" },
      "8-28": { name: "Varalakshmi Vratam", type: "cultural", badge: "Cultural" },
      "9-4": { name: "Sri Krishna Janmashtami", type: "govt", badge: "Govt Holiday" },
      "9-14": { name: "Ganesh Chaturthi", type: "govt", badge: "Govt Holiday" },
      "10-2": { name: "Gandhi Jayanti", type: "govt", badge: "Govt Holiday" },
      "10-12": { name: "Bathukamma Starts", type: "cultural", badge: "Festival" },
      "10-19": { name: "Durgashtami", type: "govt", badge: "Govt Holiday" },
      "10-20": { name: "Vijayadashami / Dasara", type: "govt", badge: "Govt Holiday" },
      "11-8": { name: "Diwali", type: "govt", badge: "Govt Holiday" },
      "11-24": { name: "Kartika Pournami", type: "govt", badge: "Govt Holiday" },
      "12-25": { name: "Christmas", type: "govt", badge: "Govt Holiday" }
    };

    const jntuhVacations2026 = [
      { start: "1-12", end: "1-17", label: "Sankranti Vacation (JNTUH)" },
      { start: "5-11", end: "6-20", label: "Summer Vacation" },
      { start: "10-12", end: "10-17", label: "Dasara Vacation (JNTUH)" }
    ];

    function checkJntuhVacation(m, d, year) {
      if (year !== 2026) return null;
      for (let vac of jntuhVacations2026) {
        const [sM, sD] = vac.start.split('-').map(Number);
        const [eM, eD] = vac.end.split('-').map(Number);
        if (m >= sM && m <= eM && d >= sD && d <= eD) return vac.label;
      }
      return null;
    }

    function applyFilters() {
      const year = parseInt(document.getElementById("yearFilter").value);
      const m = parseInt(document.getElementById("monthFilter").value);
      const container = document.getElementById("calendar-output");
      container.innerHTML = "";

      const holidays = year === 2026 ? holidaysData2026 : {};
      const firstDay = new Date(year, m, 1).getDay();
      const daysInMonth = new Date(year, m + 1, 0).getDate();
      let satCount = 0;

      let monthHtml = `
        <div class="month-card">
          <div class="month-header">
            <span class="month-title">${monthNamesEn[m]} ${year}</span>
            <span class="samvatsara-info">${year === 2026 ? 'Sri Krodhi / Sri Vishvavasu Samvatsaram' : 'Sri Vishvavasu Samvatsaram'}</span>
          </div>
          <div class="calendar-grid">
      `;

      weekDaysEn.forEach(w => {
        monthHtml += `<div class="grid-header">${w}</div>`;
      });

      for (let i = 0; i < firstDay; i++) {
        monthHtml += `<div class="day-cell empty"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateObj = new Date(year, m, d);
        const dayOfWeek = dateObj.getDay();
        const dateKey = `${year}-${m + 1}-${d}`;

        let isSunday = (dayOfWeek === 0);
        let isSaturday = (dayOfWeek === 6);
        let jntuhSatLabel = "";

        if (isSaturday) {
          satCount++;
          if (satCount === 2 || satCount === 4) {
            jntuhSatLabel = `${satCount}th Saturday (JNTUH)`;
          }
        }

        const holiday = holidays[`${m + 1}-${d}`];
        const jntuhVac = checkJntuhVacation(m + 1, d, year);
        const panchang = getTeluguPanchang(year, m, d);
        const savedNote = localStorage.getItem(dateKey) || "";

        let cellClass = "day-cell";
        if (isSunday) cellClass += " sunday";

        let badgeHtml = "";
        let descText = "";

        if (holiday) {
          cellClass += ` is-${holiday.type}`;
          badgeHtml = `<span class="holiday-badge badge-${holiday.type}">${holiday.badge}</span>`;
          descText = holiday.name;
        } else if (jntuhSatLabel && year === 2026) {
          cellClass += " is-jntuh";
          badgeHtml = `<span class="holiday-badge badge-jntuh">JNTUH</span>`;
          descText = jntuhSatLabel;
        } else if (jntuhVac) {
          cellClass += " is-jntuh";
          badgeHtml = `<span class="holiday-badge badge-jntuh">Vacation</span>`;
          descText = jntuhVac;
        }

        let tithiTag = "";
        if (panchang.tithi === "Pournami") {
          tithiTag = `<span class="key-tithi-tag tag-pournami">🌕 Pournami</span>`;
        } else if (panchang.tithi === "Amavasya") {
          tithiTag = `<span class="key-tithi-tag tag-amavasya">🌑 Amavasya</span>`;
        } else if (panchang.tithi === "Ashtami") {
          tithiTag = `<span class="key-tithi-tag tag-ashtami">✨ Ashtami</span>`;
        } else if (panchang.tithi === "Navami") {
          tithiTag = `<span class="key-tithi-tag tag-navami">✨ Navami</span>`;
        } else if (panchang.tithi === "Dashami") {
          tithiTag = `<span class="key-tithi-tag tag-dashami">✨ Dashami</span>`;
        }

        monthHtml += `
          <div class="${cellClass}">
            <div class="cell-top">
              <span class="date-num">${d}</span>
              ${badgeHtml}
            </div>
            ${tithiTag}
            ${descText ? `<div class="event-desc" title="${descText}">${descText}</div>` : ''}
            
            <div class="panchang-box">
              <span class="panchang-masa">${panchang.masa}</span> | 
              <span class="panchang-tithi">${panchang.paksham} ${panchang.tithi}</span>
            </div>

            <textarea class="day-note" placeholder="Add note..." data-key="${dateKey}">${savedNote}</textarea>
          </div>
        `;
      }

      monthHtml += `</div>`;

      monthHtml += `
        <div class="college-panel">
          <div><strong>JNTUH Academic Note:</strong> ${m === 0 ? 'Sankranti Break (Jan 12-17)' : m === 4 ? 'Summer Vacation Commences' : m === 9 ? 'Dasara Break (Oct 12-17)' : 'Regular Academic Days'}</div>
          <div><strong>Working Days:</strong> ~22 Days</div>
        </div>
      </div>`;

      container.innerHTML = monthHtml;

      // Attach local storage save listeners
      document.querySelectorAll(".day-note").forEach(textarea => {
        textarea.addEventListener("input", (e) => {
          const key = e.target.getAttribute("data-key");
          localStorage.setItem(key, e.target.value);
        });
      });
    }

    const today = new Date();
    if (today.getFullYear() === 2026 || today.getFullYear() === 2027) {
      document.getElementById("yearFilter").value = today.getFullYear();
      document.getElementById("monthFilter").value = today.getMonth();
    }

    window.onload = function() {
      applyFilters();
    };
  </script>
</body>
</html>
