<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 – 2027 Calendar Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background-color: #ffffff;
      color: #111827;
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Control Bar */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1e293b;
      color: #fff;
      padding: 8px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-label { font-size: 0.88rem; font-weight: 700; color: #facc15; }
    
    select {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Auto-Save Indicator Badge */
    .save-status {
      margin-left: auto;
      font-size: 0.8rem;
      font-weight: 700;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.15);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(74, 222, 128, 0.3);
      transition: opacity 0.2s ease;
    }

    /* Main Calendar Container with Vertical Scrollbar */
    .calendar-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding-right: 2px;
    }

    .month-card {
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    .month-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    
    .month-title { font-size: 1.2rem; font-weight: 800; color: #0f172a; }
    .samvatsara-info { font-size: 0.78rem; background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 6px; font-weight: 700; }

    /* Calendar Grid */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      flex-grow: 1;
    }

    /* Grey Header Pills */
    .day-header {
      background: #f1f5f9;
      color: #1e293b;
      text-align: center;
      padding: 8px 4px;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 8px;
    }

    /* Regular Clean Day Box Styling */
    .day-cell {
      background-color: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 110px;
    }

    .day-cell.empty { background: transparent !important; border: none !important; min-height: 0; }

    /* Thick Vibrant Green for Sundays & Holidays */
    .day-cell.highlight-green {
      background-color: #86efac !important;
      border: 2px solid #16a34a !important;
    }

    /* Active/Current Day Outline */
    .day-cell.active-day {
      border: 2.5px solid #0f172a !important;
    }

    .cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      line-height: 1;
      margin-bottom: 2px;
    }
    
    .date-num { font-size: 0.95rem; font-weight: 800; color: #0f172a; }

    .moon-symbol {
      font-size: 0.95rem;
      line-height: 1;
      filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.15));
    }

    .event-desc {
      font-size: 0.75rem;
      font-weight: 800;
      color: #064e3b;
      line-height: 1.2;
      margin-bottom: 2px;
    }

    .panchang-box {
      font-size: 0.62rem;
      color: #475569;
      font-weight: 700;
      margin-top: 1px;
    }

    /* Integrated Notes Area - Thick Red Text */
    .day-note {
      width: 100%;
      flex-grow: 1;
      margin-top: 4px;
      border: 1px solid rgba(15, 23, 42, 0.15);
      border-radius: 6px;
      resize: none;
      padding: 3px 5px;
      font-size: 0.75rem;
      font-weight: 800 !important;
      color: #dc2626 !important;
      background: rgba(255, 255, 255, 0.9);
      line-height: 1.2;
    }

    .day-note:hover, .day-note:focus {
      outline: none;
      border-color: #dc2626;
      background: #ffffff;
    }

    .college-panel {
      margin-top: 8px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* Mobile Layout Adaptation */
    @media (max-width: 768px) {
      body {
        padding: 6px;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .filter-bar {
        padding: 6px 10px;
        gap: 8px;
        justify-content: space-between;
      }

      .filter-group { gap: 4px; }
      .filter-label { font-size: 0.8rem; }
      select { font-size: 0.8rem; padding: 4px 8px; }

      .save-status { font-size: 0.7rem; padding: 2px 5px; }

      .month-title { font-size: 1.05rem; }
      .samvatsara-info { font-size: 0.68rem; padding: 2px 6px; }

      .calendar-grid { gap: 3px; }

      .day-header {
        font-size: 0.72rem;
        padding: 5px 2px;
        border-radius: 5px;
      }

      .day-cell {
        min-height: 85px;
        padding: 3px 4px;
        border-radius: 8px;
      }

      .date-num { font-size: 0.8rem; }
      .moon-symbol { font-size: 0.8rem; }
      .event-desc { font-size: 0.62rem; }
      .panchang-box { font-size: 0.52rem; }

      .day-note {
        font-size: 0.7rem;
        padding: 2px 3px;
        margin-top: 2px;
      }

      .college-panel {
        flex-direction: column;
        gap: 2px;
        font-size: 0.68rem;
        padding: 4px 6px;
      }
    }
  </style>
</head>
<body>

  <!-- Controls: Year, Month & Auto-Save Indicator -->
  <div class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">Year:</span>
      <select id="yearFilter" onchange="applyFilters()">
        <option value="2026">2026</option>
        <option value="2027">2027</option>
      </select>
    </div>

    <div class="filter-group">
      <span class="filter-label">Month:</span>
      <select id="monthFilter" onchange="applyFilters()">
        <option value="0">January</option>
        <option value="1">February</option>
        <option value="2">March</option>
        <option value="3">April</option>
        <option value="4">May</option>
        <option value="5">June</option>
        <option value="6">July</option>
        <option value="7">August</option>
        <option value="8" selected>September</option>
        <option value="9">October</option>
        <option value="10">November</option>
        <option value="11">December</option>
      </select>
    </div>

    <span class="save-status" id="saveIndicator">Auto-Saved ✓</span>
  </div>

  <!-- Scrollable Calendar Grid Container -->
  <div class="calendar-container" id="calendar-output"></div>

  <script>
    const lunarMasas = [
      "Chaitra", "Vaishakha", "Jyeshtha", "Ashadha", 
      "Shravana", "Bhadrapada", "Ashvin", "Kartika", 
      "Margashirsha", "Pushya", "Magha", "Phalguna"
    ];

    const tithiNamesShukla = [
      "Padyami", "Vidiya", "Thadiya", "Chavithi", "Panchami", 
      "Shashti", "Saptami", "Ashtami", "Navami", "Dashami", 
      "Ekadashi", "Dwadashi", "Thrayodashi", "Chaturdashi", "Pournami"
    ];

    const tithiNamesKrishna = [
      "Padyami", "Vidiya", "Thadiya", "Chavithi", "Panchami", 
      "Shashti", "Saptami", "Ashtami", "Navami", "Dashami", 
      "Ekadashi", "Dwadashi", "Thrayodashi", "Chaturdashi", "Amavasya"
    ];

    const weekDaysEn = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const monthNamesEn = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    function getTeluguPanchang(year, monthIndex, day) {
      const currentDate = new Date(year, monthIndex, day);
      const refDate = new Date(2026, 0, 19);
      const diffDays = Math.floor((currentDate - refDate) / (1000 * 60 * 60 * 24));
      
      const synodicMonth = 29.530588;
      const totalLunarMonths = Math.floor(diffDays / synodicMonth);
      
      let masaIdx = (10 + totalLunarMonths) % 12;
      if (masaIdx < 0) masaIdx += 12;

      let phase = ((diffDays % synodicMonth) + synodicMonth) % synodicMonth;
      let tithiVal = Math.floor((phase / synodicMonth) * 30);

      let paksham = tithiVal < 15 ? "Shukla" : "Krishna";
      let tithiName = tithiVal < 15 ? tithiNamesShukla[tithiVal] : tithiNamesKrishna[tithiVal - 15];

      return { masa: lunarMasas[masaIdx], paksham: paksham, tithi: tithiName };
    }

    const holidaysData2026 = {
      "1-1": "New Year",
      "1-13": "Bhogi",
      "1-14": "Sankranti / Pongal",
      "1-15": "Kanuma",
      "1-26": "Republic Day",
      "2-15": "Maha Shivaratri",
      "3-3": "Holi",
      "3-19": "Ugadi",
      "3-21": "Eid-ul-Fitr (Ramzan)",
      "3-27": "Sri Rama Navami",
      "4-3": "Good Friday",
      "4-14": "Dr. Ambedkar Jayanti",
      "5-1": "May Day",
      "5-27": "Bakrid (Eid-ul-Adha)",
      "6-2": "Telangana Formation Day",
      "6-25": "Muharram",
      "7-20": "Bonalu",
      "8-15": "Independence Day",
      "8-25": "Milad-un-Nabi",
      "9-4": "Sri Krishna Janmashtami",
      "9-14": "Vinayaka Chavithi",
      "10-2": "Gandhi Jayanti",
      "10-12": "Bathukamma Vac.",
      "10-19": "Durgashtami",
      "10-20": "Vijayadashami / Dasara",
      "11-8": "Diwali",
      "11-24": "Kartika Pournami",
      "12-25": "Christmas"
    };

    function applyFilters() {
      const year = parseInt(document.getElementById("yearFilter").value);
      const m = parseInt(document.getElementById("monthFilter").value);
      const container = document.getElementById("calendar-output");
      container.innerHTML = "";

      const holidays = year === 2026 ? holidaysData2026 : {};
      const firstDay = new Date(year, m, 1).getDay();
      const daysInMonth = new Date(year, m + 1, 0).getDate();
      let satCount = 0;

      let monthHtml = `
        <div class="month-card">
          <div class="month-header">
            <span class="month-title">${monthNamesEn[m]} ${year}</span>
            <span class="samvatsara-info">${year === 2026 ? 'Sri Krodhi / Sri Vishvavasu Samvatsaram' : 'Sri Vishvavasu Samvatsaram'}</span>
          </div>
          <div class="calendar-grid">
      `;

      weekDaysEn.forEach(w => {
        monthHtml += `<div class="day-header">${w}</div>`;
      });

      for (let i = 0; i < firstDay; i++) {
        monthHtml += `<div class="day-cell empty"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateObj = new Date(year, m, d);
        const dayOfWeek = dateObj.getDay();
        const dateKey = `${year}-${m + 1}-${d}`;

        let isSunday = (dayOfWeek === 0);
        let isSaturday = (dayOfWeek === 6);
        let holidayName = holidays[`${m + 1}-${d}`] || "";

        if (isSaturday) {
          satCount++;
          if (satCount === 2) holidayName = "2nd Saturday";
          if (satCount === 4) holidayName = "4th Saturday";
        }

        if (isSunday && !holidayName) {
          holidayName = "Sunday";
        }

        const isGreenCell = isSunday || Boolean(holidayName);
        const isToday = (year === 2026 && m === 8 && d === 6);

        const panchang = getTeluguPanchang(year, m, d);
        const savedNote = localStorage.getItem(dateKey) || "";

        let moonIcon = "";
        if (panchang.tithi === "Pournami") {
          moonIcon = `<span class="moon-symbol" title="Pournami (Full Moon)">🌕</span>`;
        } else if (panchang.tithi === "Amavasya") {
          moonIcon = `<span class="moon-symbol" title="Amavasya (New Moon)">🌑</span>`;
        } else if (panchang.tithi === "Ashtami") {
          moonIcon = `<span class="moon-symbol" title="Ashtami">🌓</span>`;
        } else if (panchang.tithi === "Navami") {
          moonIcon = `<span class="moon-symbol" title="Navami">🌔</span>`;
        }

        let cellClass = "day-cell";
        if (isGreenCell) cellClass += " highlight-green";
        if (isToday) cellClass += " active-day";

        monthHtml += `
          <div class="${cellClass}">
            <div class="cell-top">
              <span class="date-num">${d}</span>
              ${moonIcon}
            </div>
            ${holidayName ? `<div class="event-desc">${holidayName}</div>` : ''}
            
            <div class="panchang-box">${panchang.paksham} ${panchang.tithi}</div>

            <textarea class="day-note" placeholder="Note..." data-key="${dateKey}">${savedNote}</textarea>
          </div>
        `;
      }

      monthHtml += `</div>`;

      monthHtml += `
        <div class="college-panel">
          <div><strong>JNTUH Academic Note:</strong> ${m === 0 ? 'Sankranti Break (Jan 12-17)' : m === 4 ? 'Summer Vacation Commences' : m === 9 ? 'Dasara Break (Oct 12-17)' : 'Regular Academic Days'}</div>
          <div><strong>Working Days:</strong> ~22 Days</div>
        </div>
      </div>`;

      container.innerHTML = monthHtml;

      // Real-time Auto-Save Engine
      const indicator = document.getElementById("saveIndicator");
      document.querySelectorAll(".day-note").forEach(textarea => {
        textarea.addEventListener("input", (e) => {
          const key = e.target.getAttribute("data-key");
          localStorage.setItem(key, e.target.value);
          
          indicator.textContent = "Saving...";
          indicator.style.color = "#facc15";
          
          setTimeout(() => {
            indicator.textContent = "Auto-Saved ✓";
            indicator.style.color = "#4ade80";
          }, 300);
        });
      });
    }

    window.onload = function() {
      applyFilters();
    };
  </script>
</body>
</html>
